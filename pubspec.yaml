name: kinnav
description: "Kinnav — an all-in-one women's safety, empowerment and rewards app."
publish_to: 'none'
version: 1.0.1+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Localisation. `flutter_localizations` supplies the translated Material and
  # Cupertino widget strings (date pickers, "Cancel", semantics labels); `intl`
  # backs the generated AppLocalizations and locale-aware formatting.
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  supabase_flutter: ^2.16.0
  image_picker: ^1.1.2
  # Native OAuth for the Supabase-native ID-token sign-in flow.
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the real app on a simulator/emulator. Used for the end-to-end pass
  # and to capture store screenshots on iOS, where the simulator has no
  # equivalent of `adb shell input tap`.
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Runs gen-l10n on build, turning lib/l10n/*.arb into AppLocalizations.
  generate: true
  assets:
    - assets/logo/
