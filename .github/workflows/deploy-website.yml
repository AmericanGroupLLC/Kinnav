# Builds website/ and publishes the compiled site to the `deploy` branch.
#
# master holds source only. cPanel (HostGator) clones this repository, checks
# out `deploy`, and deploys it — so the server never needs Node, pnpm or a
# build step. See website/DEPLOY.md.

name: Build and publish website

on:
  push:
    branches:
      - master
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

# Needed to force-push the built site to the deploy branch.
permissions:
  contents: write

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # packageManager lives in website/package.json, not the repo root.
          package_json_file: website/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: website
        run: pnpm lint

      # Unit, integration, accessibility, PHP handler and build-output tests.
      # A broken contact form or a missing .htaccess rule fails here rather
      # than on the live site.
      - name: Test
        working-directory: website
        run: pnpm test

      - name: Build
        working-directory: website
        run: pnpm build

      - name: Add the cPanel deployment manifest
        run: |
          cat > website/dist/.cpanel.yml <<'EOF'
          ---
          # Generated by .github/workflows/deploy-website.yml — do not edit by hand.
          deployment:
            tasks:
              - export DEPLOYPATH=/home2/safecode/kinnav.com/
              # Clear old content-hashed bundles so they don't accumulate.
              - /bin/rm -rf $DEPLOYPATH/assets
              # Copy the site but never .git or this manifest: serving .git
              # would publish the whole repository history.
              - /usr/bin/rsync -a --exclude '.git/' --exclude '.cpanel.yml' ./ $DEPLOYPATH
          EOF

      - name: Publish to the deploy branch
        working-directory: website/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b deploy
          git add -A
          git commit -q -m "Build website from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force -q origin deploy
          echo "Published $(git ls-files | wc -l) files to the deploy branch."

      - name: Summarise
        run: |
          {
            echo "### Website published to \`deploy\`"
            echo
            echo "| File | Size |"
            echo "|---|---|"
            find website/dist -type f -printf '| %p | %s bytes |\n' | sort | head -30
          } >> "$GITHUB_STEP_SUMMARY"
