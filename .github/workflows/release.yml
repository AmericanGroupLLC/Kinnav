name: Release

# Build signed release artifacts and attach them to a GitHub Release.
# Trigger: push a tag like v1.0.0  (git tag v1.0.0 && git push origin v1.0.0)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      # Restore signing keystore + key.properties from repo secrets
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
          printf '%s' "$KEY_PROPERTIES" > android/key.properties
      - name: Build APK + AAB
        env: { MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }} }
        run: |
          flutter build apk --release --dart-define=BACKEND=americangroupllc --dart-define=MAPS_API_KEY=$MAPS_API_KEY
          flutter build appbundle --release --dart-define=BACKEND=americangroupllc --dart-define=MAPS_API_KEY=$MAPS_API_KEY
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      # Import Apple signing cert + provisioning profile from secrets, then export IPA
      - name: Build signed IPA
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          flutter build ipa --release \
            --dart-define=BACKEND=americangroupllc \
            --dart-define=MAPS_API_KEY=$MAPS_API_KEY \
            --export-options-plist=ios/ExportOptions.plist
      - uses: softprops/action-gh-release@v2
        with:
          files: build/ios/ipa/*.ipa
