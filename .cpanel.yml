---
# cPanel Git Version Control deployment for kinnav.com.
#
# IMPORTANT: this copies website/dist (the built site), NOT website/ itself.
# website/ is Vite + React source — its index.html loads /src/main.jsx, which
# only a dev server can resolve, and copying it would also publish src/,
# package.json and the eslint config. The committed website/dist is what a
# browser can actually run.
#
# Run `pnpm build` in website/ and commit the result before deploying, then use
# cPanel -> Git Version Control -> Manage -> Pull or Deploy -> Deploy HEAD Commit.
deployment:
  tasks:
    - export DEPLOYPATH=/home2/safecode/kinnav.com/
    # Drop old content-hashed bundles so stale ones don't accumulate forever.
    - /bin/rm -rf $DEPLOYPATH/assets
    # `.` rather than `*` so .htaccess and other dotfiles come across too.
    - /bin/cp -a website/dist/. $DEPLOYPATH
